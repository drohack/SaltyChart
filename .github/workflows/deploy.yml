# Push to master → build + publish both app images to GHCR.
#
# The Unraid server polls GHCR every 10 minutes (User Script
# `update_saltychart`, reference copy at tools/unraid/update_saltychart.sh)
# and swaps containers when a new :latest appears — so a green run here IS a
# deploy. The backend image builds FROM the pinned saltychart-backend-base
# tag (built by build-base.yml), so routine runs only push ~100 MB of app
# layers, never the Whisper models.
#
# Single job on purpose: images are built first and pushed together at the
# end, so the backend/frontend :latest pair updates atomically — a failed
# backend build can never produce a frontend-only deploy.
#
# The full pre-deploy suite (tools/tests/run_all.py — Playwright + GPU) can't
# run on hosted runners; run it locally BEFORE pushing to master.

name: deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ---- gates: fail fast before any image work -------------------------
      - name: Backend typecheck
        working-directory: backend
        run: |
          npm ci
          npm run generate
          npx tsc --noEmit

      - name: Frontend build check
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---- build both images (no push yet) --------------------------------
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: echo "date_sha=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: |
            ghcr.io/drohack/saltychart-backend:latest
            ghcr.io/drohack/saltychart-backend:${{ steps.tags.outputs.date_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: |
            ghcr.io/drohack/saltychart-frontend:latest
            ghcr.io/drohack/saltychart-frontend:${{ steps.tags.outputs.date_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # ---- push everything only after BOTH builds succeeded ---------------
      - name: Push images
        run: |
          docker push ghcr.io/drohack/saltychart-backend:latest
          docker push ghcr.io/drohack/saltychart-backend:${{ steps.tags.outputs.date_sha }}
          docker push ghcr.io/drohack/saltychart-frontend:latest
          docker push ghcr.io/drohack/saltychart-frontend:${{ steps.tags.outputs.date_sha }}
