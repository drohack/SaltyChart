# Builds the heavy backend base image (python/ffmpeg/pip deps/Whisper models,
# ~3.3 GB) and pushes it to GHCR under an explicit version tag.
#
# Manual-dispatch ONLY - base bumps are deliberate. After this succeeds,
# update the `FROM ghcr.io/drohack/saltychart-backend-base:<version>` line in
# backend/Dockerfile to match, and push that change so deploy.yml uses it.

name: build-base

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base image version tag (e.g. v1, v2)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.base
          push: true
          tags: ghcr.io/drohack/saltychart-backend-base:${{ inputs.version }}
