# ---------------------------------------------------------------------------
#  SaltyChart Docker-Compose stack
#
#  • Runs the two production images (backend API + frontend static site),
#    pulled from GHCR. CI (.github/workflows/deploy.yml) pushes a new
#    :latest pair on every push to master; on the Unraid server the
#    `update_saltychart` User Script (tools/unraid/update_saltychart.sh)
#    polls with `docker compose pull` and swaps containers automatically.
#  • Rollback: pin the image lines to a previous immutable YYYYMMDD-<sha>
#    tag (visible on the GHCR package pages) and `docker compose up -d`.
#  • The SQLite DB is a bind mount at /mnt/user/appdata/saltychart/prisma so
#    it survives image upgrades and is directly visible/backupable on the
#    host. (A legacy `saltychart_db` named volume from an older revision of
#    this file went stale in April 2026 - do not resurrect it.)
#  • Creates an explicit bridge network (salty-net) to ensure the container
#    IPs stay stable between restarts - many Unraid users like to reference
#    them from other stacks or fail2ban rules.
#  • Maps the nginx 80 port to 8085 on the host while keeping the API
#    internal-only.
# ---------------------------------------------------------------------------

services:
  backend:
    image: ghcr.io/drohack/saltychart-backend:latest
    container_name: saltychart-backend
    volumes:
      - /mnt/user/appdata/saltychart/prisma:/app/prisma
    expose:
      - "3000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: file:/app/prisma/data.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - salty-net

  frontend:
    image: ghcr.io/drohack/saltychart-frontend:latest
    container_name: saltychart-frontend
    ports:
      - "8085:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - salty-net

# ---------------------------------------------------------------------------
#  Named resources
# ---------------------------------------------------------------------------

networks:
  salty-net:
    external: true
